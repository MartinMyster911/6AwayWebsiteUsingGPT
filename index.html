<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Estate Plus - Dubai</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Welcome to Real Estate Plus</h1>
      <p>
        Find your dream property in Dubai. Whether you're looking for luxury
        apartments, villas, or commercial properties, we are here to help you
        make the right choice.
      </p>

      <div class="image-gallery">
        <img
          src="https://cdn.midjourney.com/d80a62a4-b891-46b7-bd5c-1f95310ea159/0_1.png"
          alt="Dubai Real Estate"
        />
        <img
          src="https://cdn.midjourney.com/d80a62a4-b891-46b7-bd5c-1f95310ea159/0_2.png"
          alt="Luxury Apartments"
        />
        <img
          src="https://cdn.midjourney.com/d80a62a4-b891-46b7-bd5c-1f95310ea159/0_3.png"
          alt="Villas in Dubai"
        />
      </div>

      <p>
        Enter your real estate needs below and let us assist you in finding the
        perfect property.
      </p>
      <form
        action="https://docs.google.com/forms/d/e/1FAIpQLSf9-yf7I4bk4M1uqFaMqnKjsGKj_nGeH7SYfQAhbH8r7n__Kg/formResponse"
        method="POST"
      >
        <input
          type="text"
          name="entry.1065890494"
          placeholder="Your Name"
          required
        />
        <input
          type="email"
          name="entry.2000100246"
          placeholder="Your Email"
          required
        />
        <select name="entry.236062744" required>
          <option value="">Select Property Type</option>
          <option value="Apartment">Apartment</option>
          <option value="Villa">Villa</option>
          <option value="Commercial">Commercial</option>
          <option value="Land">Land</option>
        </select>
        <textarea
          name="entry.587628892"
          placeholder="Describe your requirements"
          rows="4"
          required
        ></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
